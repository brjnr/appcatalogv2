# Bare-metal / VM nginx site for AppCatalog (see README §3d).
# Copy to /etc/nginx/sites-available/appcatalog and symlink into sites-enabled.
server {
  listen 80;
  server_name apps.example.com;              # <-- your hostname
  root /opt/appcatalog/frontend/dist;         # <-- output of `yarn build`
  client_max_body_size 5m;

  location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;               # SPA routing
  }
}
